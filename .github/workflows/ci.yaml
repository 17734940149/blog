name: 项目检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端类型、测试与生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  backend:
    name: Python API 测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  containers:
    name: 容器构建与持久化冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Compose 与 HTTPS 配置
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker compose -f compose.yaml -f compose.production.yaml build caddy
          docker compose -f compose.yaml -f compose.production.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        env:
          APP_URL: https://blog.example.com
          DOMAIN: blog.example.com
          ACME_EMAIL: admin@example.com
      - run: docker compose up -d --build --wait --wait-timeout 180
        env:
          DEMO_SEED: "false"
      - name: 检查前后端连接及重启后数据卷
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/health
          docker compose exec -T api python -c "from pathlib import Path; Path('/app/data/.ci-persistence').write_text('persistent', encoding='utf-8')"
          docker compose restart api
          docker compose up -d --wait --wait-timeout 120
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/health
          docker compose exec -T api python -c "from pathlib import Path; assert Path('/app/data/.ci-persistence').read_text(encoding='utf-8') == 'persistent'"
      - name: 输出失败日志
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: 清理测试容器
        if: always()
        run: docker compose down --volumes
