name: stacknote

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 35s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *service-defaults
    image: stacknote-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATA_DIR: /app/data
      DEMO_SEED: ${DEMO_SEED:-false}
    volumes:
      - blog-data:/app/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
  web:
    <<: *service-defaults
    image: stacknote-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0755
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 100

volumes:
  blog-data:
    name: ${DATA_VOLUME:-stacknote-data}
